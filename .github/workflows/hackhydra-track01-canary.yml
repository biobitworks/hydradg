name: HackHydra Track01 HydraOntology canary

concurrency:
  group: hackhydra-track01-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hackhydra-track01-canary.yml'
      - 'HydraDG_DaisyTrain_v0.3.7/scripts/track01_hydraontology_canary.py'
      - 'HydraDG_DaisyTrain_v0.3.7/scripts/best_use_typed_graph.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hydra-ontology-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HYDRADB_PIN: 6a2fbb192f37f51a93690a2ae2d2f5e27e6e4219
      PKG: HydraDG_DaisyTrain_v0.3.7
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          python -m py_compile \
            "$PKG/scripts/best_use_typed_graph.py" \
            "$PKG/scripts/track01_hydraontology_canary.py"
      - name: Install HydraDB prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libclang-dev cmake pkg-config libcypher-parser-dev libgraphblas-dev curl git python3
          rustup update stable
          rustup default stable
      - name: Pin and build HydraDB
        run: |
          git clone https://github.com/hydra-db/hydradb.git /tmp/hydradb
          git -C /tmp/hydradb checkout --detach "$HYDRADB_PIN"
          test "$(git -C /tmp/hydradb rev-parse HEAD)" = "$HYDRADB_PIN"
          cd /tmp/hydradb
          cargo build --locked --features server-runtime --bin graph-node
      - name: Start pinned HydraDB
        run: |
          mkdir -p /tmp/hydra-store /tmp/hydra-cache "$RUNNER_TEMP/track01"
          python - <<'PY' > "$RUNNER_TEMP/track01/auth-token"
          import secrets
          print(secrets.token_urlsafe(36))
          PY
          chmod 600 "$RUNNER_TEMP/track01/auth-token"
          cd /tmp/hydradb
          nohup env \
            CLOUD_PROVIDER=local \
            LOCAL_PATH=/tmp/hydra-store \
            GRAPH_NAMESPACE=default \
            GRAPH_ID=default \
            GRAPH_CELL_ID=cell-0 \
            GRAPH_CELLS=cell-0 \
            GRAPH_NODE_ID=node-0 \
            GRAPH_BOLT_NODE_ADDRESSES=node-0=127.0.0.1:7687 \
            GRAPH_ADVERTISED_BOLT_ADDR=127.0.0.1:7687 \
            GRAPH_DATA_CACHE_DIR=/tmp/hydra-cache \
            GRAPH_AUTH_TOKEN_FILE="$RUNNER_TEMP/track01/auth-token" \
            GRAPH_ALLOW_PLAINTEXT=true \
            RUST_MIN_STACK=33554432 \
            ./target/debug/graph-node > "$RUNNER_TEMP/track01/hydradb.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/track01/hydradb.pid"
          for i in $(seq 1 90); do
            curl -fsS http://127.0.0.1:8443/healthz >/dev/null && exit 0
            kill -0 "$(cat "$RUNNER_TEMP/track01/hydradb.pid")" || { tail -200 "$RUNNER_TEMP/track01/hydradb.log"; exit 1; }
            sleep 2
          done
          tail -200 "$RUNNER_TEMP/track01/hydradb.log"
          exit 1
      - name: Run HydraOntology canary
        run: |
          python "$PKG/scripts/track01_hydraontology_canary.py" \
            --token-file "$RUNNER_TEMP/track01/auth-token" \
            --out "$RUNNER_TEMP/track01/hydraontology_canary.json"
          cat "$RUNNER_TEMP/track01/hydraontology_canary.json"
          sha256sum "$RUNNER_TEMP/track01/hydraontology_canary.json" > "$RUNNER_TEMP/track01/SHA256SUMS.txt"
      - name: Preserve Track 01 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hackhydra-track01-hydraontology-canary
          path: |
            ${{ runner.temp }}/track01/hydraontology_canary.json
            ${{ runner.temp }}/track01/SHA256SUMS.txt
            ${{ runner.temp }}/track01/hydradb.log
          if-no-files-found: warn
          retention-days: 14
