name: HydraDG Gitleaks Release

on:
  push:
    branches:
      - hack-hydra/public-product-final-20260819
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull pinned Gitleaks v8.28.0
        shell: bash
        run: |
          set -euo pipefail
          docker pull ghcr.io/gitleaks/gitleaks:v8.28.0
          docker run --rm ghcr.io/gitleaks/gitleaks:v8.28.0 version

      - name: Scan exact repository history
        id: scan
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p security-artifacts
          # Preserve exhaustive rename analysis for this unusually large history.
          git config diff.renameLimit 20000
          set +e
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git \
            --config /repo/.gitleaks.toml \
            --redact=100 \
            --no-banner \
            --report-format json \
            --report-path /repo/security-artifacts/gitleaks-release.json \
            .
          status=$?
          set -e
          if [ ! -f security-artifacts/gitleaks-release.json ]; then
            printf '[]\n' > security-artifacts/gitleaks-release.json
          fi
          printf 'exit_code=%s\n' "$status" >> "$GITHUB_OUTPUT"
          printf 'GITLEAKS_EXIT_CODE=%s\n' "$status"

      - name: Upload redacted Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydradg-gitleaks-release-${{ github.sha }}
          path: security-artifacts/gitleaks-release.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce zero findings
        shell: bash
        run: |
          test "${{ steps.scan.outputs.exit_code }}" = "0" || {
            echo "GITLEAKS_RELEASE=FAIL"
            exit 1
          }
          echo "GITLEAKS_RELEASE=PASS"
