name: HydraDG end-to-end

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        working-directory: apps/hydradg-web
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: apps/hydradg-web
        run: npm run typecheck

      - name: Build web app
        working-directory: apps/hydradg-web
        run: npm run build

      - name: Start pinned-interface HydraDB smoke node
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hydradb-data/store /tmp/hydradb-data/cache
          printf '%s\n' 'local-development-token-32-bytes' > /tmp/hydradb-data/auth-token
          docker pull ghcr.io/hydra-db/hydradb:latest
          docker image inspect ghcr.io/hydra-db/hydradb:latest --format '{{json .RepoDigests}}' | tee /tmp/hydradb-image-digest.json
          docker run -d --name hydradb \
            --user "$(id -u):$(id -g)" \
            -p 7687:7687 -p 8443:8443 -p 9090:9090 \
            -v /tmp/hydradb-data:/data \
            -e CLOUD_PROVIDER=local \
            -e LOCAL_PATH=/data/store \
            -e GRAPH_NAMESPACE=default \
            -e GRAPH_ID=default \
            -e GRAPH_CELL_ID=cell-0 \
            -e GRAPH_CELLS=cell-0 \
            -e GRAPH_NODE_ID=node-0 \
            -e GRAPH_BOLT_NODE_ADDRESSES=node-0=127.0.0.1:7687 \
            -e GRAPH_ADVERTISED_BOLT_ADDR=127.0.0.1:7687 \
            -e GRAPH_DATA_CACHE_DIR=/data/cache \
            -e GRAPH_AUTH_TOKEN_FILE=/data/auth-token \
            -e GRAPH_ALLOW_PLAINTEXT=true \
            -e RUST_MIN_STACK=33554432 \
            ghcr.io/hydra-db/hydradb:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9090/readyz >/tmp/hydradb-ready.txt 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs hydradb
          exit 1

      - name: Prove HydraDB direct write/read
        shell: bash
        run: |
          set -euo pipefail
          TOKEN='local-development-token-32-bytes'
          curl -fsS http://127.0.0.1:8443/v1/graphs/default/query \
            -H "Authorization: Bearer $TOKEN" \
            -H 'X-Graph-Namespace: default' \
            -H 'Content-Type: application/json' \
            --data '{"cell_id":"cell-0","query":"MERGE (a:CiProbe {id: 1})-[:ROUND_TRIP]->(b:CiProbe {id: 2}) RETURN b.id AS id"}' \
            | tee /tmp/direct-write.json
          curl -fsS http://127.0.0.1:8443/v1/graphs/default/query \
            -H "Authorization: Bearer $TOKEN" \
            -H 'X-Graph-Namespace: default' \
            -H 'Content-Type: application/json' \
            --data '{"cell_id":"cell-0","query":"MATCH (a:CiProbe {id: 1})-[:ROUND_TRIP]->(b) RETURN b.id AS id"}' \
            | tee /tmp/direct-read.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/direct-read.json'))
          assert d.get('rows'), d
          print('hydradb-direct-roundtrip-ok')
          PY

      - name: Start HydraDG web backend
        working-directory: apps/hydradg-web
        env:
          GRAPH_BACKEND: hydradb-http
          HYDRADB_HTTP_URL: http://127.0.0.1:8443
          HYDRADB_GRAPH_ID: default
          HYDRADB_GRAPH_NAMESPACE: default
          HYDRADB_CELL_ID: cell-0
          HYDRADB_AUTH_TOKEN: local-development-token-32-bytes
        run: |
          nohup npm run start -- -H 127.0.0.1 -p 3000 >/tmp/hydradg-web.log 2>&1 &
          echo $! >/tmp/hydradg-web.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/status >/tmp/status.json 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hydradg-web.log
          exit 1

      - name: Run HydraDG API end-to-end proof
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/api/status | tee /tmp/status.json
          curl -fsS -X POST http://127.0.0.1:3000/api/query \
            -H 'Content-Type: application/json' \
            --data '{"action":"fixture"}' | tee /tmp/fixture.json
          python - <<'PY'
          import json
          s=json.load(open('/tmp/status.json'))
          f=json.load(open('/tmp/fixture.json'))
          assert s['graph']['reachable'] is True, s
          assert f['fixture']['fixture_state']=='DETERMINISTIC_SYNTHETIC_TEST_FIXTURE', f
          ids=f['fixture']['ids']
          open('/tmp/seed_v1','w').write(ids['seed_v1'])
          open('/tmp/seed_v2','w').write(ids['seed_v2'])
          open('/tmp/subject_key','w').write(f['fixture']['subject_key'])
          PY

          SUBJECT=$(cat /tmp/subject_key)
          SEED1=$(cat /tmp/seed_v1)
          SEED2=$(cat /tmp/seed_v2)

          curl -fsS -X POST http://127.0.0.1:3000/api/query \
            -H 'Content-Type: application/json' \
            --data "{\"action\":\"current\",\"subject_key\":\"$SUBJECT\"}" | tee /tmp/current.json
          curl -fsS -X POST http://127.0.0.1:3000/api/query \
            -H 'Content-Type: application/json' \
            --data "{\"action\":\"history\",\"id\":\"$SEED1\"}" | tee /tmp/history.json
          curl -fsS -X POST http://127.0.0.1:3000/api/query \
            -H 'Content-Type: application/json' \
            --data "{\"action\":\"provenance\",\"id\":\"$SEED2\"}" | tee /tmp/provenance.json

          curl -fsS http://127.0.0.1:3000/ >/tmp/home.html
          curl -fsS http://127.0.0.1:3000/demo >/tmp/demo.html
          curl -fsS http://127.0.0.1:3000/eligibility >/tmp/eligibility.html

          python - <<'PY'
          import json
          current=json.load(open('/tmp/current.json'))
          history=json.load(open('/tmp/history.json'))
          provenance=json.load(open('/tmp/provenance.json'))
          assert any('beta' in str(r.get('payload','')).lower() for r in current.get('rows',[])), current
          assert any(r.get('relation')=='SUPERSEDED_BY' for r in history.get('rows',[])), history
          hops=provenance.get('hops',[])
          assert len(hops) >= 3, provenance
          relations={h.get('relation') for h in hops}
          assert 'SUPPORTED_BY' in relations and 'DERIVED_FROM' in relations, relations
          print('hydradg-e2e-ok')
          PY

      - name: Secret-pattern smoke scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|neo4j\+s://[^ ]+:[^ ]+@)' -- ':!*.md' ':!*.ipynb'; then
            echo 'Potential secret material detected'
            exit 1
          fi

      - name: Write E2E receipt
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/hydradg-e2e
          cp /tmp/hydradb-image-digest.json /tmp/hydradg-e2e/ 2>/dev/null || true
          cp /tmp/status.json /tmp/hydradg-e2e/ 2>/dev/null || true
          cp /tmp/fixture.json /tmp/hydradg-e2e/ 2>/dev/null || true
          cp /tmp/current.json /tmp/hydradg-e2e/ 2>/dev/null || true
          cp /tmp/history.json /tmp/hydradg-e2e/ 2>/dev/null || true
          cp /tmp/provenance.json /tmp/hydradg-e2e/ 2>/dev/null || true
          cp /tmp/direct-write.json /tmp/hydradg-e2e/ 2>/dev/null || true
          cp /tmp/direct-read.json /tmp/hydradg-e2e/ 2>/dev/null || true
          cp /tmp/hydradg-web.log /tmp/hydradg-e2e/ 2>/dev/null || true
          docker logs hydradb >/tmp/hydradg-e2e/hydradb.log 2>&1 || true
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('/tmp/hydradg-e2e')
          entries=[]
          for p in sorted(root.glob('*')):
              if p.is_file():
                  entries.append({'file':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size})
          (root/'manifest.json').write_text(json.dumps({'state':'E2E_EXECUTED_IN_CI','files':entries},indent=2)+'\n')
          PY

      - name: Upload E2E receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydradg-e2e-receipt
          path: /tmp/hydradg-e2e
          if-no-files-found: warn
          retention-days: 14
