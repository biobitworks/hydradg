name: HydraDG end-to-end

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        working-directory: apps/hydradg-web
        run: npm install --no-audit --no-fund

      - name: Typecheck
        working-directory: apps/hydradg-web
        run: npm run typecheck

      - name: Build web app
        working-directory: apps/hydradg-web
        run: npm run build

      - name: Verify resumed FCO/FCG custody root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hydradg-e2e
          python3 scripts/build_fcg_root.py --output /tmp/hydradg-e2e/custody-manifest.json
          python3 - <<'PY'
          import json
          m=json.load(open('/tmp/hydradg-e2e/custody-manifest.json'))
          assert m['root_convention']=='HYDRADG-FCG-RFC6962-v1', m
          assert m['node_count'] >= 18, m
          assert m['edge_count'] >= 16, m
          assert m['author_signature_state']=='PENDING_PUBLIC_KEY_LEAF_AND_AUTHOR_KEY', m
          assert m['custody_gap_state']=='DECLARED_GAP_NOT_RETROACTIVELY_BACKFILLED', m
          print('custody-root-ok', m['fcg_root'])
          PY

      - name: Test Ed25519 signature mechanism with ephemeral CI key
        shell: bash
        run: |
          set -euo pipefail
          ROOT=$(python3 -c 'import json; print(json.load(open("/tmp/hydradg-e2e/custody-manifest.json"))["fcg_root"])')
          printf '%s' "$ROOT" >/tmp/hydradg-e2e/fcg-root.txt
          openssl genpkey -algorithm ed25519 -out /tmp/hydradg-e2e/ephemeral-ci-private.pem
          openssl pkey -in /tmp/hydradg-e2e/ephemeral-ci-private.pem -pubout -out /tmp/hydradg-e2e/ephemeral-ci-public.pem
          openssl pkeyutl -sign -inkey /tmp/hydradg-e2e/ephemeral-ci-private.pem -rawin -in /tmp/hydradg-e2e/fcg-root.txt -out /tmp/hydradg-e2e/ephemeral-ci.sig
          openssl pkeyutl -verify -pubin -inkey /tmp/hydradg-e2e/ephemeral-ci-public.pem -rawin -in /tmp/hydradg-e2e/fcg-root.txt -sigfile /tmp/hydradg-e2e/ephemeral-ci.sig
          FP=$(openssl pkey -pubin -in /tmp/hydradg-e2e/ephemeral-ci-public.pem -outform DER | openssl dgst -sha256 -r | awk '{print $1}')
          python3 - "$ROOT" "$FP" <<'PY'
          import json,sys
          json.dump({
            'state':'EPHEMERAL_CI_KEY_NOT_AUTHOR_IDENTITY',
            'algorithm':'Ed25519',
            'signed_root':sys.argv[1],
            'ephemeral_public_key_der_sha256':sys.argv[2],
            'claim_ceiling':'SIGNATURE_MECHANISM_EXECUTED_AND_VERIFIED; NOT AUTHOR AUTHENTICATION'
          }, open('/tmp/hydradg-e2e/ephemeral-signature-receipt.json','w'), indent=2)
          PY
          rm -f /tmp/hydradg-e2e/ephemeral-ci-private.pem

      - name: Start HydraDB smoke node
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hydradb-data/store /tmp/hydradb-data/cache
          printf '%s\n' 'local-development-token-32-bytes' > /tmp/hydradb-data/auth-token
          docker pull ghcr.io/hydra-db/hydradb:latest
          docker image inspect ghcr.io/hydra-db/hydradb:latest --format '{{json .RepoDigests}}' | tee /tmp/hydradg-e2e/hydradb-image-digest.json
          docker run -d --name hydradb \
            --user "$(id -u):$(id -g)" \
            -p 7687:7687 -p 8443:8443 -p 9090:9090 \
            -v /tmp/hydradb-data:/data \
            -e CLOUD_PROVIDER=local \
            -e LOCAL_PATH=/data/store \
            -e GRAPH_NAMESPACE=default \
            -e GRAPH_ID=default \
            -e GRAPH_CELL_ID=cell-0 \
            -e GRAPH_CELLS=cell-0 \
            -e GRAPH_NODE_ID=node-0 \
            -e GRAPH_BOLT_NODE_ADDRESSES=node-0=127.0.0.1:7687 \
            -e GRAPH_ADVERTISED_BOLT_ADDR=127.0.0.1:7687 \
            -e GRAPH_DATA_CACHE_DIR=/data/cache \
            -e GRAPH_AUTH_TOKEN_FILE=/data/auth-token \
            -e GRAPH_ALLOW_PLAINTEXT=true \
            -e RUST_MIN_STACK=33554432 \
            ghcr.io/hydra-db/hydradb:latest
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:9090/readyz >/tmp/hydradg-e2e/hydradb-ready.txt 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs hydradb
          exit 1

      - name: Prove HydraDB direct write/read
        shell: bash
        run: |
          set -euo pipefail
          TOKEN='local-development-token-32-bytes'
          curl -fsS http://127.0.0.1:8443/v1/graphs/default/query \
            -H "Authorization: Bearer $TOKEN" \
            -H 'X-Graph-Namespace: default' \
            -H 'Content-Type: application/json' \
            --data '{"cell_id":"cell-0","query":"MERGE (a:CiProbe {id: 1})-[:ROUND_TRIP]->(b:CiProbe {id: 2})"}' \
            | tee /tmp/hydradg-e2e/direct-write.json
          curl -fsS http://127.0.0.1:8443/v1/graphs/default/query \
            -H "Authorization: Bearer $TOKEN" \
            -H 'X-Graph-Namespace: default' \
            -H 'Content-Type: application/json' \
            --data '{"cell_id":"cell-0","query":"MATCH (a:CiProbe {id: 1})-[:ROUND_TRIP]->(b) RETURN b.id AS id"}' \
            | tee /tmp/hydradg-e2e/direct-read.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/hydradg-e2e/direct-read.json'))
          assert d.get('rows'), d
          print('hydradb-direct-roundtrip-ok')
          PY

      - name: Start HydraDG web backend
        working-directory: apps/hydradg-web
        env:
          GRAPH_BACKEND: hydradb-http
          HYDRADB_HTTP_URL: http://127.0.0.1:8443
          HYDRADB_GRAPH_ID: default
          HYDRADB_GRAPH_NAMESPACE: default
          HYDRADB_CELL_ID: cell-0
          HYDRADB_AUTH_TOKEN: local-development-token-32-bytes
        run: |
          nohup npm run start -- -H 127.0.0.1 -p 3000 >/tmp/hydradg-e2e/hydradg-web.log 2>&1 &
          echo $! >/tmp/hydradg-e2e/hydradg-web.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/status >/tmp/hydradg-e2e/status.json 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/hydradg-e2e/hydradg-web.log
          exit 1

      - name: Run HydraDG API end-to-end proof
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:3000/api/status | tee /tmp/hydradg-e2e/status.json
          curl -fsS -X POST http://127.0.0.1:3000/api/query \
            -H 'Content-Type: application/json' \
            --data '{"action":"fixture"}' | tee /tmp/hydradg-e2e/fixture.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/hydradg-e2e/status.json'))
          f=json.load(open('/tmp/hydradg-e2e/fixture.json'))
          assert s['graph']['reachable'] is True, s
          fixture=f['fixture']
          assert fixture['fixture_state']=='DETERMINISTIC_SYNTHETIC_TEST_FIXTURE', fixture
          assert fixture['state_field_contract']=='DIMENSIONLESS_INFORMATION_STATE_ABSTRACTION_NOT_PHYSICAL_GIBBS_ENERGY', fixture
          assert [x['label'] for x in fixture['timeline']] == ['reference','mutation','restoration'], fixture['timeline']
          assert fixture['timeline'][1]['mutation_distance'] > fixture['timeline'][2]['mutation_distance'], fixture['timeline']
          assert fixture['timeline'][2]['restoration_gain'] > 0, fixture['timeline']
          ids=fixture['ids']
          open('/tmp/hydradg-e2e/seed_v1','w').write(ids['seed_v1'])
          open('/tmp/hydradg-e2e/seed_v2','w').write(ids['seed_v2'])
          open('/tmp/hydradg-e2e/subject_key','w').write(fixture['subject_key'])
          PY

          SUBJECT=$(cat /tmp/hydradg-e2e/subject_key)
          SEED1=$(cat /tmp/hydradg-e2e/seed_v1)
          SEED2=$(cat /tmp/hydradg-e2e/seed_v2)

          curl -fsS -X POST http://127.0.0.1:3000/api/query \
            -H 'Content-Type: application/json' \
            --data "{\"action\":\"current\",\"subject_key\":\"$SUBJECT\"}" | tee /tmp/hydradg-e2e/current.json
          curl -fsS -X POST http://127.0.0.1:3000/api/query \
            -H 'Content-Type: application/json' \
            --data "{\"action\":\"history\",\"id\":\"$SEED1\"}" | tee /tmp/hydradg-e2e/history.json
          curl -fsS -X POST http://127.0.0.1:3000/api/query \
            -H 'Content-Type: application/json' \
            --data "{\"action\":\"provenance\",\"id\":\"$SEED2\"}" | tee /tmp/hydradg-e2e/provenance.json

          curl -fsS http://127.0.0.1:3000/ >/tmp/hydradg-e2e/home.html
          curl -fsS http://127.0.0.1:3000/demo >/tmp/hydradg-e2e/demo.html
          curl -fsS http://127.0.0.1:3000/graph >/tmp/hydradg-e2e/graph.html
          curl -fsS http://127.0.0.1:3000/eligibility >/tmp/hydradg-e2e/eligibility.html

          python3 - <<'PY'
          import json
          current=json.load(open('/tmp/hydradg-e2e/current.json'))
          history=json.load(open('/tmp/hydradg-e2e/history.json'))
          provenance=json.load(open('/tmp/hydradg-e2e/provenance.json'))
          assert any('beta' in str(r.get('payload','')).lower() for r in current.get('rows',[])), current
          assert any('statesnapshot' in str(r.get('type','')).lower() for r in current.get('rows',[])), current
          assert any(r.get('relation')=='SUPERSEDED_BY' for r in history.get('rows',[])), history
          hops=provenance.get('hops',[])
          relations={h.get('relation') for h in hops}
          assert 'SUPPORTED_BY' in relations and 'DERIVED_FROM' in relations, relations
          print('hydradg-e2e-ok')
          PY

      - name: Secret-pattern smoke scan
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|neo4j\+s://[^ ]+:[^ ]+@)' -- ':!*.md' ':!*.ipynb'; then
            echo 'Potential secret material detected'
            exit 1
          fi

      - name: Write E2E receipt manifest
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/hydradg-e2e
          docker logs hydradb >/tmp/hydradg-e2e/hydradb.log 2>&1 || true
          rm -f /tmp/hydradg-e2e/ephemeral-ci-private.pem
          python3 - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('/tmp/hydradg-e2e')
          entries=[]
          for p in sorted(root.glob('*')):
              if p.is_file() and p.name != 'manifest.json':
                  entries.append({'file':p.name,'sha256':hashlib.sha256(p.read_bytes()).hexdigest(),'bytes':p.stat().st_size})
          (root/'manifest.json').write_text(json.dumps({
              'state':'E2E_EXECUTED_IN_GITHUB_CI',
              'author_signature_state':'NOT_PERFORMED_IN_CI',
              'ephemeral_signature_state':'MECHANISM_TEST_ONLY_IF_RECEIPT_PRESENT',
              'files':entries
          },indent=2)+'\n')
          PY

      - name: Upload E2E receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hydradg-e2e-receipt
          path: /tmp/hydradg-e2e
          if-no-files-found: warn
          retention-days: 14
