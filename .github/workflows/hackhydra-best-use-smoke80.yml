name: HackHydra Best Use v1 smoke80 (archived)

# Historical v1 workflow. The live run is preserved as Actions run 32206301823
# and the failure is documented in:
# HydraDG_DaisyTrain_v0.3.7/eval/best_use_reference/HYDRADB_CI_FAILURE_20260819.md
#
# v1 is manual-only because it intentionally retains the superseded session
# identity rule that HydraDB rejected. Active structural CI is v2.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archived-v1:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Explain archived state
        run: |
          cat <<'EOF'
          This workflow is preserved only as a historical v1 entrypoint.
          Known live failure: GitHub Actions run 32206301823.
          Earliest divergent dependency: Session vertex identity omitted occurrence_position.
          Active live-HydraDB gate: hackhydra-best-use-v2-structural.yml.
          EOF
          test -f HydraDG_DaisyTrain_v0.3.7/eval/best_use_reference/HYDRADB_CI_FAILURE_20260819.md
